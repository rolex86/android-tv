name: Test Trakt Public Client

on:
  push:
    paths:
      - '.github/workflows/test-trakt-public-client.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Trakt device flow without client secret
        shell: bash
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          set -euo pipefail
          : "${TRAKT_CLIENT_ID:?Missing TRAKT_CLIENT_ID}"

          CODE_BODY="$(jq -nc --arg id "$TRAKT_CLIENT_ID" '{client_id:$id}')"
          CODE_RESPONSE="$(curl --fail-with-body --silent --show-error             -H 'Content-Type: application/json'             -H 'trakt-api-version: 2'             -H "trakt-api-key: $TRAKT_CLIENT_ID"             -d "$CODE_BODY"             https://api.trakt.tv/oauth/device/code)"

          DEVICE_CODE="$(printf '%s' "$CODE_RESPONSE" | jq -r '.device_code // empty')"
          if [[ -z "$DEVICE_CODE" ]]; then
            echo "Trakt did not issue a device code." >&2
            printf '%s' "$CODE_RESPONSE" | jq -c '{error,error_description}' >&2 || true
            exit 1
          fi

          TOKEN_BODY="$(jq -nc --arg code "$DEVICE_CODE" --arg id "$TRAKT_CLIENT_ID"             '{code:$code,client_id:$id}')"

          STATUS="$(curl --silent --show-error             -o /tmp/trakt-token.json             -w '%{http_code}'             -H 'Content-Type: application/json'             -H 'trakt-api-version: 2'             -H "trakt-api-key: $TRAKT_CLIENT_ID"             -d "$TOKEN_BODY"             https://api.trakt.tv/oauth/device/token)"

          ERROR_CODE="$(jq -r '.error // empty' /tmp/trakt-token.json 2>/dev/null || true)"
          echo "Trakt device-token probe: HTTP $STATUS error=${ERROR_CODE:-none}"

          if [[ "$STATUS" == "400" ]]; then
            echo "PASS: the new Trakt public client can use Device Code Flow without a client_secret."
            exit 0
          fi

          echo "FAIL: Device Code Flow without client_secret was not accepted." >&2
          jq -c '{error,error_description}' /tmp/trakt-token.json >&2 2>/dev/null || true
          exit 1
