name: Sync Nuvio RS Plus upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-nuvio-rs-plus-upstream.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: nuvio-rs-plus-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Plus repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve current baseline and newest matching Nuvio RS release
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASELINE="$(sed -nE 's/^- Synced baseline: `([^`]+)`.*/\1/p' nuvio-rs-plus/PLUS_UPSTREAM.md | head -n1)"
          if [[ -z "$BASELINE" ]]; then
            echo "Could not read synced baseline from nuvio-rs-plus/PLUS_UPSTREAM.md" >&2
            exit 1
          fi

          if [[ "$BASELINE" == *-beta* ]]; then
            TAG_RE='^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+-autosync\.[0-9]+$'
          else
            TAG_RE='^[0-9]+\.[0-9]+\.[0-9]+-autosync\.[0-9]+$'
          fi

          LATEST="$(
            gh api --paginate repos/DavidVamaiotu/NuvioTV-Reshaped/releases?per_page=100               --jq '.[] | select(.draft == false) | [.published_at, .tag_name] | @tsv'             | awk -F '\t' -v re="$TAG_RE" '$2 ~ re { print }'             | sort -r             | head -n1             | cut -f2
          )"

          if [[ -z "$LATEST" ]]; then
            echo "No matching upstream Nuvio RS release found" >&2
            exit 1
          fi

          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [[ "$LATEST" == "$BASELINE" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already synced to $BASELINE"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New upstream release: $BASELINE -> $LATEST"
          fi

      - name: Merge upstream release onto Plus changes
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        env:
          BASELINE: ${{ steps.upstream.outputs.baseline }}
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          set -euo pipefail

          # Use a full clone here. The sync performs a real three-way merge across
          # release tags, so a promisor/partial clone can fail when an older object
          # referenced by the new release is no longer obtainable lazily.
          git clone --no-checkout \
            https://github.com/DavidVamaiotu/NuvioTV-Reshaped.git /tmp/nuvio-upstream
          git -C /tmp/nuvio-upstream fetch --tags --force

          git -C /tmp/nuvio-upstream checkout --detach "$BASELINE"
          git -C /tmp/nuvio-upstream switch -c plus-sync-work

          # Reconstruct our Plus tree as a commit directly on top of the exact
          # upstream release we last synced. This gives Git a real three-way
          # merge base, so upstream changes and Plus-only changes are merged
          # normally instead of one tree blindly overwriting the other.
          rsync -a --delete --exclude='.git' nuvio-rs-plus/ /tmp/nuvio-upstream/

          git -C /tmp/nuvio-upstream config user.name "github-actions[bot]"
          git -C /tmp/nuvio-upstream config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/nuvio-upstream add -A
          git -C /tmp/nuvio-upstream commit -m "Nuvio RS Plus changes on $BASELINE"

          set +e
          git -C /tmp/nuvio-upstream merge --no-ff --no-commit "$LATEST"
          MERGE_STATUS=$?
          set -e

          if (( MERGE_STATUS != 0 )); then
            mapfile -t CONFLICTS < <(git -C /tmp/nuvio-upstream diff --name-only --diff-filter=U)
            printf 'Upstream merge conflicts: %s\n' "${CONFLICTS[*]}"

            # One-time, fail-closed conflict resolution for the reviewed beta.5 -> beta.7 sync.
          # Git first merges every non-conflicting upstream/Plus change automatically.
          # For these exact three conflicts, retain the full upstream file and reapply
          # ALL Plus-specific edits from the beta.5 baseline using unique text anchors.
          if [[ "$BASELINE" == "1.1.0-beta.5-autosync.1" && "$LATEST" == "1.1.0-beta.7-autosync.1" && "${CONFLICTS[*]}" == "app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerRuntimeControllerMpv.kt app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerRuntimeControllerPlaybackEvents.kt app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerRuntimeControllerTrackSelection.kt" ]]; then
            echo "Resolving three reviewed player conflicts while preserving Plus features"
            git -C /tmp/nuvio-upstream checkout --theirs -- "${CONFLICTS[@]}"
            python3 - <<'PY'
          from pathlib import Path
          import json
          patches = json.loads(r"""{"PlayerRuntimeControllerMpv.kt":[["                channelCount = track.channelCount,\n                isSelected = track.isSelected\n            )\n        }\n\n    val internalSubtitleTracks","                channelCount = track.channelCount,\n                isSelected = track.isSelected,\n                rawLabel = track.name\n            )\n        }\n\n    val internalSubtitleTracks"],["    markMpvTextTracksScannedIfReady(hasInternalSubtitleTracks = internalSubtitleTracks.isNotEmpty())\n    maybeRestorePendingAudioSelectionAfterSubtitleRefresh(audioTracks)","    markMpvTextTracksScannedIfReady(hasInternalSubtitleTracks = internalSubtitleTracks.isNotEmpty())\n    val restoredAudioAfterSubtitleRefresh =\n        maybeRestorePendingAudioSelectionAfterSubtitleRefresh(audioTracks)"],["    applyPersistedTrackPreference(\n        audioTracks = audioTracks,\n        subtitleTracks = internalSubtitleTracks\n    )\n    logSwitchTrace(","    val rememberedAudioHandled = applyPersistedTrackPreference(\n        audioTracks = audioTracks,\n        subtitleTracks = internalSubtitleTracks\n    )\n    if (restoredAudioAfterSubtitleRefresh == null && !rememberedAudioHandled) {\n        tryApplySmartAudioSelection(audioTracks)\n    }\n    logSwitchTrace("]],"PlayerRuntimeControllerPlaybackEvents.kt":[["import com.nuvio.tv.domain.model.WatchProgress","import com.nuvio.tv.domain.model.WatchProgress\nimport com.nuvio.tv.ui.screens.player.aisubtitles.isAiSubtitle"],["        PlayerEvent.OnSeekBackward -> {\n            if (_playbackTimeline.value.isLive) return\n            onEvent(PlayerEvent.OnSeekBy(deltaMs = -PlayerScrubRates.STEP_SHORT_MS))\n        }\n        is PlayerEvent.OnSeekBy -> {","        PlayerEvent.OnSeekBackward -> {\n            if (_playbackTimeline.value.isLive) return\n            onEvent(PlayerEvent.OnSeekBy(deltaMs = -PlayerScrubRates.STEP_SHORT_MS))\n        }\n        PlayerEvent.OnPlusWhatDidTheySay -> {\n            runPlusWhatDidTheySay()\n        }\n        is PlayerEvent.OnSeekBy -> {"],["            autoSubtitleSelected = true\n            rememberAddonSubtitleSelection(event.subtitle)\n            selectAddonSubtitle(event.subtitle)\n            if (hasBurnedInServerSubtitle) clearServerSubtitle()\n            runSelectedAutomaticSubtitleSync(event.subtitle) // AutoSync hook","            autoSubtitleSelected = true\n            if (hasBurnedInServerSubtitle) clearServerSubtitle()\n            if (isAiSubtitle(event.subtitle)) {\n                selectAddonSubtitle(event.subtitle)\n            } else {\n                rememberAddonSubtitleSelection(event.subtitle)\n                selectAddonSubtitle(event.subtitle)\n                runSelectedAutomaticSubtitleSync(event.subtitle) // AutoSync hook\n            }"]],"PlayerRuntimeControllerTrackSelection.kt":[["import com.nuvio.tv.domain.model.Subtitle\nimport com.nuvio.tv.ui.screens.player.autosync.AutoSyncSyncedSubtitle","import com.nuvio.tv.domain.model.Subtitle\nimport com.nuvio.tv.ui.screens.player.aisubtitles.AiSubtitleFileStore\nimport com.nuvio.tv.ui.screens.player.aisubtitles.isAiSubtitle\nimport com.nuvio.tv.ui.screens.player.autosync.AutoSyncSyncedSubtitle"],["                \"id=${subtitle.id} inferredMime=$inferredMime \" +\n                \"url=${subtitle.url}\"\n        )\n\n        // Prefer sidecar hot-attach","                \"id=${subtitle.id} inferredMime=$inferredMime \" +\n                \"url=${subtitle.url}\"\n        )\n\n        if (isAiSubtitle(subtitle)) {\n            val body = AiSubtitleFileStore.read(subtitle) ?: return@let\n            disableSubtitles()\n            pendingAddonSubtitleLanguage = null\n            pendingAddonSubtitleTrackId = null\n            pendingAudioSelectionAfterSubtitleRefresh = null\n            _uiState.update {\n                it.copy(selectedAddonSubtitle = subtitle, selectedSubtitleTrackIndex = -1)\n            }\n            startSidecarAddonSubtitle(subtitle, rawBodyLoader = { body })\n            return@let\n        }\n\n        // Prefer sidecar hot-attach"]]}""")
          required = json.loads(r"""{"PlayerRuntimeControllerMpv.kt":["rawLabel = track.name","markMpvTextTracksScannedIfReady","tryApplySmartAudioSelection(audioTracks)"],"PlayerRuntimeControllerPlaybackEvents.kt":["runPlusWhatDidTheySay()","isAiSubtitle(event.subtitle)","clearServerSubtitle()","publishPartyPlayback"],"PlayerRuntimeControllerTrackSelection.kt":["AiSubtitleFileStore.read(subtitle)","AutoSyncSyncedSubtitle.clear()","startSidecarAddonSubtitle(subtitle, rawBodyLoader = { body })"]}""")
          root = Path("/tmp/nuvio-upstream/app/src/main/java/com/nuvio/tv/ui/screens/player/")
          for filename, replacements in patches.items():
              path = root / filename
              body = path.read_text(encoding='utf-8')
              for before, after in replacements:
                  count = body.count(before)
                  if count != 1:
                      raise SystemExit(f'Unsafe Plus merge: {filename} expected 1 anchor, found {count}')
                  body = body.replace(before, after, 1)
              for token in required[filename]:
                  if token not in body:
                      raise SystemExit(f'Unsafe Plus merge: {filename} missing {token}')
              if '<<<<<<<' in body or '>>>>>>>' in body:
                  raise SystemExit(f'Unresolved conflict markers in {filename}')
              path.write_text(body, encoding='utf-8')
              print(f'Applied reviewed Plus preservation patch to {filename}')
          PY
            git -C /tmp/nuvio-upstream add -- "${CONFLICTS[@]}"
            mapfile -t CONFLICTS < <(git -C /tmp/nuvio-upstream diff --name-only --diff-filter=U)
          fi
          
            # Reviewed beta.7.1 -> beta.7.2 merge. Fail closed for other conflicts.
            if [[ "$BASELINE" == "1.1.0-beta.7-autosync.1" &&
                  "$LATEST" == "1.1.0-beta.7-autosync.2" &&
                  "${CONFLICTS[*]}" == "app/src/main/java/com/nuvio/tv/ui/screens/player/autosync/bubble/AutoSyncBubbleToast.kt app/src/main/java/com/nuvio/tv/ui/screens/player/autosync/bubble/AutoSyncBubbleToasts.kt" ]]; then
              git -C /tmp/nuvio-upstream checkout --theirs -- "${CONFLICTS[@]}"
              python3 .github/scripts/resolve_nuvio_plus_beta7_bubbles.py /tmp/nuvio-upstream
              git -C /tmp/nuvio-upstream add -- "${CONFLICTS[@]}"
              mapfile -t CONFLICTS < <(git -C /tmp/nuvio-upstream diff --name-only --diff-filter=U)
            fi

            # Reviewed beta.7.2 -> beta.7.3 merge.
            # Keep the Plus track-selection/settings additions, add every new Arc hook from
            # upstream, and adopt upstream's new AudioSync notification policy wholesale.
            if [[ "$BASELINE" == "1.1.0-beta.7-autosync.2" &&
                  "$LATEST" == "1.1.0-beta.7-autosync.3" &&
                  "${CONFLICTS[*]}" == "app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerRuntimeControllerTracks.kt app/src/main/java/com/nuvio/tv/ui/screens/player/audiosync/AudioSyncFallback.kt app/src/main/java/com/nuvio/tv/ui/screens/settings/NuvioReshapedSettingsContent.kt" ]]; then
              TRACKS="app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerRuntimeControllerTracks.kt"
              AUDIO_SYNC="app/src/main/java/com/nuvio/tv/ui/screens/player/audiosync/AudioSyncFallback.kt"
              SETTINGS="app/src/main/java/com/nuvio/tv/ui/screens/settings/NuvioReshapedSettingsContent.kt"

              git -C /tmp/nuvio-upstream checkout --ours -- "$TRACKS" "$SETTINGS"
              git -C /tmp/nuvio-upstream checkout --theirs -- "$AUDIO_SYNC"

              python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/nuvio-upstream")

          def replace_once(path, before, after):
              body = path.read_text(encoding="utf-8")
              count = body.count(before)
              if count != 1:
                  raise SystemExit(f"Unsafe beta.7.3 merge: {path.name} expected 1 anchor, found {count}")
              path.write_text(body.replace(before, after, 1), encoding="utf-8")

          tracks = root / "app/src/main/java/com/nuvio/tv/ui/screens/player/PlayerRuntimeControllerTracks.kt"
          replace_once(
              tracks,
              """    if (restoredAudioAfterSubtitleRefresh == null && !rememberedAudioHandled) {
                  tryApplySmartAudioSelection(audioTracks)
              }
              if (currentStreamHasVideoTrack) {
                  maybeScheduleFirstFrameWatchdog()
              } else {
                  cancelFirstFrameWatchdog()
              }""",
              """    if (restoredAudioAfterSubtitleRefresh == null && !rememberedAudioHandled) {
                  tryApplySmartAudioSelection(audioTracks)
              }
              applyLosslessAudioDefaultIfUnset(audioTracks) // Nuvio RS hook: Arc formats
              if (currentStreamHasVideoTrack) {
                  maybeScheduleFirstFrameWatchdog()
                  maybeScheduleTunnelAvSyncWatchdog() // Nuvio RS hook: Arc formats
              } else {
                  cancelFirstFrameWatchdog()
                  cancelTunnelAvSyncWatchdog() // Nuvio RS hook: Arc formats
              }""",
          )
          replace_once(
              tracks,
              """    pending.audio?.let { audioSelection ->
                  if (audioTracks.isEmpty()) {""",
              """    pending.audio?.let { audioSelection ->
                  persistedAudioPreferenceSeenForStream = true // Nuvio RS hook: the lossless default never runs over a saved pick
                  if (audioTracks.isEmpty()) {""",
          )

          settings = root / "app/src/main/java/com/nuvio/tv/ui/screens/settings/NuvioReshapedSettingsContent.kt"
          replace_once(
              settings,
              """        autoSyncBubbleSettingsItems(enabled = playerSettings.playerPreference != PlayerPreference.EXTERNAL) // Nuvio RS hook: AutoSync bubble
              aiSubtitleSettingsItems(enabled = playerSettings.playerPreference != PlayerPreference.EXTERNAL)
              seekrKeySettingsItems()""",
              """        autoSyncBubbleSettingsItems(enabled = playerSettings.playerPreference != PlayerPreference.EXTERNAL) // Nuvio RS hook: AutoSync bubble
              aiSubtitleSettingsItems(enabled = playerSettings.playerPreference != PlayerPreference.EXTERNAL)
              autoSourceRecoverySettingsItems(playerSettings)
              reshapedFormatsSettingsItems(playerSettings) // Nuvio RS: Arc sound and picture formats
              seekrKeySettingsItems()""",
          )
          replace_once(
              settings,
              """        pillNavSettingsItems()
              liveTvSettingsItems()""",
              """        pillNavSettingsItems()
              netflixUiSettingsItems()
              liveTvSettingsItems()""",
          )

          required = {
              tracks: [
                  "tryApplySmartAudioSelection(audioTracks)",
                  "PlusAudioAwareSubtitleRules.resolve(",
                  "PlusSubtitleSourcePolicy.shouldPreferAddon(",
                  "applyLosslessAudioDefaultIfUnset(audioTracks)",
                  "maybeScheduleTunnelAvSyncWatchdog()",
                  "persistedAudioPreferenceSeenForStream = true",
              ],
              settings: [
                  "aiSubtitleSettingsItems(",
                  "PlusHomeFocusDiagnosticsSettingsSection()",
                  "autoSourceRecoverySettingsItems(playerSettings)",
                  "reshapedFormatsSettingsItems(playerSettings)",
                  "netflixUiSettingsItems()",
              ],
              root / "app/src/main/java/com/nuvio/tv/ui/screens/player/audiosync/AudioSyncFallback.kt": [
                  "private val syncAnnounced = AtomicBoolean(false)",
                  "syncAnnounced.set(false)",
                  "is AudioSyncStatus.Estimated, is AudioSyncStatus.Adjusted -> return",
                  "is AudioSyncStatus.Synced -> if (!syncAnnounced.compareAndSet(false, true)) return",
                  "controller.prepareRecognizer()",
              ],
          }
          for path, tokens in required.items():
              body = path.read_text(encoding="utf-8")
              for token in tokens:
                  if token not in body:
                      raise SystemExit(f"Unsafe beta.7.3 merge: {path.name} missing {token}")
              if "<<<<<<<" in body or ">>>>>>>" in body:
                  raise SystemExit(f"Unresolved conflict markers in {path.name}")
          PY

              git -C /tmp/nuvio-upstream add -- "$TRACKS" "$AUDIO_SYNC" "$SETTINGS"
              mapfile -t CONFLICTS < <(git -C /tmp/nuvio-upstream diff --name-only --diff-filter=U)
            fi

          # These files belong to the nested upstream checkout and are not part
            # of the Plus-specific product surface. Always follow the new upstream
            # copy so release-note/workflow churn cannot block the app sync.
            for FILE in "${CONFLICTS[@]}"; do
              case "$FILE" in
                .github/autosync-release-notes.md|.github/workflows/mirror-nuviotv-release.yml)
                  git -C /tmp/nuvio-upstream checkout --theirs -- "$FILE"
                  git -C /tmp/nuvio-upstream add "$FILE"
                  ;;
                *)
                  echo "::error::Unexpected upstream conflict in $FILE; refusing to guess a resolution."
                  exit "$MERGE_STATUS"
                  ;;
              esac
            done

            if git -C /tmp/nuvio-upstream diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Unresolved upstream conflicts remain."
              exit "$MERGE_STATUS"
            fi
          fi

          # These are invariants of our fork. If upstream ever changes in a way
          # that loses one of them, fail closed instead of publishing a reduced
          # or wrongly identified build.
          grep -Fq 'com.rolex86.nuviorsplus' /tmp/nuvio-upstream/app/reshaped.gradle
          ! grep -R -Fq 'com.nuvio.reshaped.tv.permission.MIGRATE' /tmp/nuvio-upstream/app/src/main || {
            echo "::error::Legacy migration permission returned; side-by-side install would break."
            exit 1
          }
          test -f /tmp/nuvio-upstream/app/src/main/java/com/nuvio/tv/ui/screens/player/aisubtitles/AiSubtitlePreferences.kt
          test -f /tmp/nuvio-upstream/app/src/main/java/com/nuvio/tv/ui/screens/settings/AiSubtitleSettingsItems.kt

          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("/tmp/nuvio-upstream/PLUS_UPSTREAM.md")
          s = p.read_text(encoding="utf-8")
          old = os.environ["BASELINE"]
          new = os.environ["LATEST"]
          needle = f"- Synced baseline: `{old}`"
          replacement = f"- Synced baseline: `{new}`"
          if needle not in s:
              raise SystemExit(f"Baseline marker not found: {needle}")
          p.write_text(s.replace(needle, replacement, 1), encoding="utf-8")
          PY

          rm -rf nuvio-rs-plus
          mkdir -p nuvio-rs-plus
          rsync -a --exclude='.git' /tmp/nuvio-upstream/ nuvio-rs-plus/

      - name: Verify Plus identity after sync
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'com.rolex86.nuviorsplus' nuvio-rs-plus/app/reshaped.gradle
          grep -Fq -- '- App name: `Nuvio RS Plus`' nuvio-rs-plus/PLUS_UPSTREAM.md
          grep -Fq -- '- Update repository: `rolex86/android-tv`' nuvio-rs-plus/PLUS_UPSTREAM.md
          test -f nuvio-rs-plus/app/src/main/java/com/nuvio/tv/ui/screens/player/aisubtitles/AiSubtitlePreferences.kt
          test -f nuvio-rs-plus/app/src/main/java/com/nuvio/tv/ui/screens/settings/AiSubtitleSettingsItems.kt

      - name: Commit synced upstream release
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        env:
          BASELINE: ${{ steps.upstream.outputs.baseline }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nuvio-rs-plus
          if git diff --cached --quiet; then
            echo "Nothing changed after merge; refusing to advance baseline silently." >&2
            exit 1
          fi

          git commit -m "Sync Nuvio RS Plus with upstream $LATEST"
          git push origin HEAD:main

          # Pushes made with GITHUB_TOKEN do not start another push-triggered
          # workflow. Explicitly dispatch the Plus build from the freshly
          # updated main branch instead.
          gh workflow run build-nuvio-rs-plus.yml --ref main

          echo "Synced Nuvio RS Plus from $BASELINE to $LATEST."
          echo "Dispatched Build Nuvio RS Plus from updated main."
