name: Bootstrap Nuvio RS Plus

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-nuvio-rs-plus.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ -d nuvio-rs-plus ]; then
            echo "nuvio-rs-plus already exists"
            exit 0
          fi
          git clone --depth 1 --branch subtitle-autosync https://github.com/DavidVamaiotu/NuvioTV-Reshaped.git /tmp/nuvio-rs-plus
          mkdir -p nuvio-rs-plus
          rsync -a --exclude='.git' /tmp/nuvio-rs-plus/ nuvio-rs-plus/

      - name: Apply Plus identity
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d nuvio-rs-plus ]; then
            echo "nuvio-rs-plus missing"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          root = Path("nuvio-rs-plus")
          gradle = root / "app" / "reshaped.gradle"
          text = gradle.read_text(encoding="utf-8")

          old = 'defaults.applicationId = reshapedLegacyBridge ? "com.nuviodebug.com" : "com.nuvioreshaped.tv"'
          new = 'defaults.applicationId = reshapedLegacyBridge ? "com.nuviodebug.com" : "com.rolex86.nuviorsplus"'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit("Nuvio RS applicationId hook not found")

          text = text.replace(
              'resolveProperty("NUVIO_UPDATE_GITHUB_OWNER", "NuvioMedia")',
              'resolveProperty("NUVIO_UPDATE_GITHUB_OWNER", "rolex86")'
          )
          text = text.replace(
              'resolveProperty("NUVIO_UPDATE_GITHUB_REPO", "NuvioTV")',
              'resolveProperty("NUVIO_UPDATE_GITHUB_REPO", "android-tv")'
          )
          gradle.write_text(text, encoding="utf-8")

          for p in (root / "app" / "src" / "reshaped" / "res").glob("values*/reshaped_app_name.xml"):
              value = p.read_text(encoding="utf-8")
              value = value.replace(">Nuvio RS<", ">Nuvio RS Plus<")
              p.write_text(value, encoding="utf-8")

          (root / "PLUS_UPSTREAM.md").write_text(
              "# Nuvio RS Plus upstream\n\n"
              "- Upstream: https://github.com/DavidVamaiotu/NuvioTV-Reshaped\n"
              "- Branch: `subtitle-autosync`\n"
              "- App id: `com.rolex86.nuviorsplus`\n"
              "- App name: `Nuvio RS Plus`\n"
              "- Update repository: `rolex86/android-tv`\n",
              encoding="utf-8",
          )
          PY

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nuvio-rs-plus
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Bootstrap Nuvio RS Plus source"
          git push origin HEAD:main
