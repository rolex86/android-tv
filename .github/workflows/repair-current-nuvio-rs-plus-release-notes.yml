name: Repair current Nuvio RS Plus release notes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-current-nuvio-rs-plus-release-notes.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Repair published release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="1.1.0-beta.4-autosync.2"
          UPSTREAM_BASELINE="$(sed -nE 's/^- Synced baseline: `([^`]+)`.*/\1/p' nuvio-rs-plus/PLUS_UPSTREAM.md | head -n1)"
          test "$UPSTREAM_BASELINE" = "1.1.0-beta.4-autosync.1"

          {
            printf '%s\n' '## Nuvio RS Plus' ''
            printf '%s\n' 'Nuvio RS Plus: Nuvio Reshaped plus our Plus-only features.' ''
            printf -- '- Synced with Nuvio Reshaped beta upstream through `%s`\n' "$UPSTREAM_BASELINE"
            printf '%s\n' '- Package: `com.rolex86.nuviorsplus`'
            printf '%s\n' '- In-app updater points to `rolex86/android-tv`'
            printf '%s\n' '- Keeps upstream Google sync, Trakt, MDBList, Seekr and TMDB integrations enabled'
            printf '%s\n' '- Includes Plus AI subtitle and AutoSync UI changes'
          } > /tmp/nuvio-rs-plus-release-notes.md

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file /tmp/nuvio-rs-plus-release-notes.md

          BODY="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          EXPECTED_BASELINE="- Synced with Nuvio Reshaped beta upstream through \\`$UPSTREAM_BASELINE\\`"\n          grep -Fq -- "$EXPECTED_BASELINE" <<<"$BODY"
          grep -Fq -- '- Package: `com.rolex86.nuviorsplus`' <<<"$BODY"
          grep -Fq -- '- In-app updater points to `rolex86/android-tv`' <<<"$BODY"
